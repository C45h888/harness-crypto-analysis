# Alembic configuration for the crypto-ai-anal Postgres schema.
#
# The database URL is injected at runtime: `db-init` in docker-compose.yml
# sets DATABASE_URL on the container, and alembic/env.py reads it (with a
# PG* environment-variable fallback for local use). No credentials live here.
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
# file_template = %%(rev)s_%%(slug)s
# timezone = UTC

# Logging is configured in alembic/env.py via fileConfig.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S