# Canonical runtime topology — poller feeds raw evidence into Redis on the
# cadence set by POLL_SECONDS (30s default); the harness runs the pipeline
# (calc + analysis + collate) on demand and passes the envelope to the NOOA
# analyst suite, which itself runs on demand under the `tools` profile.
services:
  redis:
    build:
      context: ./docker-redis
    image: crypto-ai-anal-redis:latest
    user: "redis"
    command: ["/usr/local/bin/redis-entrypoint.sh"]
    environment:
      TELEMETRY_HYGIENE_INTERVAL_S: "300"
      TELEMETRY_HYGIENE_MIN_AGE_S: "3600"
      REDIS_HYGIENE_URL: "unix:///tmp/redis.sock"
      TELEMETRY_HYGIENE_DRY_RUN: "false"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketflow}
      POSTGRES_USER: ${POSTGRES_USER:-marketflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12

  # One-shot schema bootstrap via Alembic. Runs once on `up`, exits.
  db-init:
    build: .
    command: ["alembic", "upgrade", "head"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-marketflow}
    volumes:
      - ./alembic:/app/alembic:ro
      - ./alembic.ini:/app/alembic.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # 5-second raw-evidence firehose. Fetches Binance data and appends
  # to the Redis raw stream. No math, no analysis — just Binance → Redis.
  poller:
    build: .
    user: "marketflow"
    command: ["python", "-m", "market_service.poller"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-marketflow}
      REDIS_URL: redis://redis:6379/0
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-marketflow}
      REDIS_STREAM_MAXLEN: ${REDIS_STREAM_MAXLEN:-1200}
      SYMBOLS: ${SYMBOLS:-BTCUSDT,ETHUSDT,SOLUSDT}
      POLL_SECONDS: ${POLL_SECONDS:-5}
      FLOW_WINDOW_SECONDS: ${FLOW_WINDOW_SECONDS:-300}
      DEPTH_LEVELS: ${DEPTH_LEVELS:-500}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      BINANCE_BASE_URL: ${BINANCE_BASE_URL:-}
      CRYPTOQUANT_API_KEY: ${CRYPTOQUANT_API_KEY:-}
      COINGECKO_BASE_URL: ${COINGECKO_BASE_URL:-}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # One-shot harness. Reads raw evidence from Redis, runs the pipeline
  # (calc + analysis + collate), then invokes NOOA agents. Use via:
  #   docker compose --profile tools run --rm harness SOLUSDT --analyze --window 15m --json
  harness:
    build: .
    user: "marketflow"
    entrypoint: ["python", "-m", "market_service.commands.harness"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-marketflow}
      REDIS_URL: redis://redis:6379/0
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-marketflow}
      REDIS_STREAM_MAXLEN: ${REDIS_STREAM_MAXLEN:-1200}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      NOOA_MODEL_PROVIDER: ${NOOA_MODEL_PROVIDER:-openai}
      NOOA_MODEL_NAME: ${NOOA_MODEL_NAME:-}
      NOOA_MODEL_BASE_URL: ${NOOA_MODEL_BASE_URL:-}
      NOOA_MODEL_TEMPERATURE: ${NOOA_MODEL_TEMPERATURE:-0.2}
      NOOA_API_KEY: ${NOOA_API_KEY:-}
      PROVIDER: ${PROVIDER:-}
      PROVIDER_API_KEY: ${PROVIDER_API_KEY:-}
      PROVIDER_BASE_URL: ${PROVIDER_BASE_URL:-}
      NOOA_SESSION_ID: ${NOOA_SESSION_ID:-}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    profiles: ["tools"]
    restart: "no"

  # NOOA CLI host. On-demand only (profiles: ["tools"]) — running it
  # always-on would burn LLM tokens every cycle for no reason. Invoke with:
  #   docker compose --profile tools run --rm nooa \
  #       market envelope SOLUSDT --latest
  #   docker compose --profile tools run --rm nooa \
  #       market analyst SOLUSDT --cycles 1 --with-memory
  nooa:
    build: .
    user: "marketflow"
    profiles: ["tools"]
    entrypoint: ["python", "-m", "market_service.commands.nooa_cli"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-marketflow}
      REDIS_URL: redis://redis:6379/0
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-marketflow}
      REDIS_STREAM_MAXLEN: ${REDIS_STREAM_MAXLEN:-1200}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      NOOA_MODEL_PROVIDER: ${NOOA_MODEL_PROVIDER:-openai}
      NOOA_MODEL_NAME: ${NOOA_MODEL_NAME:-}
      NOOA_MODEL_BASE_URL: ${NOOA_MODEL_BASE_URL:-}
      NOOA_MODEL_TEMPERATURE: ${NOOA_MODEL_TEMPERATURE:-0.2}
      NOOA_API_KEY: ${NOOA_API_KEY:-}
      NOOA_SESSION_ID: ${NOOA_SESSION_ID:-}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    restart: "no"

volumes:
  postgres_data:
  redis_data: