[project]
name = "crypto-ai-anal"
version = "2.0.0"
description = "Containerized, human-in-the-loop crypto market data harness with NOOA analyst integration"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }

[project.urls]
Repository = "https://github.com/kamii/crypto-ai-anal"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools]
packages = ["market_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py312"
line-length = 100